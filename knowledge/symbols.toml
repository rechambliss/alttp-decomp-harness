# Symbol table. One entry per routine or data label.
# Grep for an address, don't read the whole file.
# confidence: "verified" (proven by diff test) | "likely" | "guess"

[[symbol]]
address = "$00:8000"
name = "Reset"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:80C9"
name = "NMI"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:82D8"
name = "IRQ"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:8034"
name = "Reset_MainLoop"
kind = "label"
confidence = "likely"
source = "008000 map: endless loop that waits on $12, then runs one frame of work"

[[symbol]]
address = "$00:803B"
name = "Reset_DebugPauseCheck"
kind = "label"
confidence = "guess"
source = "00803b map: dead code skipped by BRA at $00:8039; $F6 bit 5 toggles $0FD7, bit 4 steps a frame"

[[symbol]]
address = "$00:8051"
name = "Reset_FrameBody"
kind = "label"
confidence = "likely"
source = "008000 spec: one pass of per-frame work (INC $1A, 00841e, 0080b5, 0085ec, clear $12)"

[[symbol]]
address = "$00:80B5"
name = "MainModuleDispatch"
kind = "routine"
confidence = "likely"
source = "0080b5 map: Y=$10, builds $03-$05 from split byte tables at $00:8061/$807D/$8099 (28 entries), JML [$0003]"

[[symbol]]
address = "$00:822D"
name = "NMI_AltThreadPath"
kind = "label"
confidence = "likely"
source = "0080c9 map: NMI path taken when $012A != 0; swaps S with $1F0A before RTI"

[[symbol]]
address = "$00:83D1"
name = "ReadJoypad"
kind = "routine"
confidence = "likely"
source = "0083d1 map: STZ $4016, reads auto-joypad $4218/$4219 into held ($F0/$F2), new-press ($F4/$F6) and previous ($F8/$FA) bytes; only caller NMI $00:8141"

[[symbol]]
address = "$00:89E0"
name = "NMI_DoUpdates"
kind = "routine"
confidence = "guess"
source = "0080c9 map: called from NMI when $12 was zero; ends in a jump table at $00:8C6E indexed by $17; not yet mapped"

[[symbol]]
address = "$00:9337"
name = "NMI_UploadIf1F0C"
kind = "routine"
confidence = "guess"
source = "0080c9 map: called from NMI alt path; DMA $7E:E800 -> VRAM $5800 ($0800 bytes) when $1F0C != 0; not yet mapped"

[[symbol]]
address = "$00:8317"
name = "IRQ_Return"
kind = "label"
confidence = "likely"
source = "0082d8 map: shared 16-bit pull frame and RTI for IRQ's normal paths"

[[symbol]]
address = "$00:831F"
name = "IRQ_ThreadSwitch"
kind = "label"
confidence = "likely"
source = "0082d8 map: IRQ path taken when $012A != 0; acks $4211, swaps S with $1F0A before RTI"

[[symbol]]
address = "$00:8061"
name = "MainModuleTable_Lo"
kind = "data"
confidence = "likely"
source = "0080b5 map: 28 low bytes of module entry addresses, indexed by $10"

[[symbol]]
address = "$00:807D"
name = "MainModuleTable_Hi"
kind = "data"
confidence = "likely"
source = "0080b5 map: 28 high bytes of module entry addresses, indexed by $10"

[[symbol]]
address = "$00:8099"
name = "MainModuleTable_Bank"
kind = "data"
confidence = "likely"
source = "0080b5 map: 28 bank bytes of module entry addresses, indexed by $10"

[[symbol]]
address = "$00:841E"
name = "ClearOamBuffer"
kind = "routine"
confidence = "likely"
source = "00841e map: sets Y byte of all 128 OAM buffer entries ($0801+4n) to $F0 (offscreen); called once per frame by Reset main loop"
