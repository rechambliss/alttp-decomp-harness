# Symbol table. One entry per routine or data label.
# Grep for an address, don't read the whole file.
# confidence: "verified" (proven by diff test) | "likely" | "guess"

[[symbol]]
address = "$00:8000"
name = "Reset"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:80C9"
name = "NMI"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:82D8"
name = "IRQ"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:8034"
name = "Reset_MainLoop"
kind = "label"
confidence = "likely"
source = "008000 map: endless loop that waits on $12, then runs one frame of work"

[[symbol]]
address = "$00:80B5"
name = "MainModuleDispatch"
kind = "routine"
confidence = "guess"
source = "008000 map: indexes byte tables by $10 and long-jumps through $03-$05; not yet mapped as its own unit"
