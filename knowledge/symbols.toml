# Symbol table. One entry per routine or data label.
# Grep for an address, don't read the whole file.
# confidence: "verified" (proven by diff test) | "likely" | "guess"

[[symbol]]
address = "$00:8000"
name = "Reset"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:80C9"
name = "NMI"
kind = "routine"
confidence = "verified"
source = "header vector"

[[symbol]]
address = "$00:82D8"
name = "IRQ"
kind = "routine"
confidence = "verified"
source = "header vector"
