Width by region: $85EC-$8643 m8x8; REP #$31 at $8644 -> m16x16 (also clears C); SEP #$10 at $8673 -> m16x8 through $8754; SEP #$20 at $8755 -> m8x8 at RTS.
Part 1 ($85EC-$8643, D=$0A00, saved/restored by PHD/PLD): loop Y = $1C,$18,..,$00 (exit when Y goes to $FC), X = Y*4. Packs 4 source bytes per output: out = (s3<<6)|(s2<<4)|(s1<<2)|s0 using ASL/ORA with no masking. Sources are dp $20..$2F + X (= $0A20..$0A9F), outputs via abs $0A00,Y..$0A03,Y (DB-relative) -> 32 bytes $0A00-$0A1F. Looks like OAM high-table packing from per-sprite 2-bit entries.
Part 2 ($8644-$8757, D=$0A00 again, PHD/PLD): builds 16-bit pointers into $0AC0-$0AF9 from table lookups indexed by $0100/$0102/$0104 (16-bit X), $0107/$0108/$0109 and $02C3 (8-bit X), plus two long-addressed animation counters at $7E:C00D/$C00F and $7E:C013/$C015, and three plain derivations from $0AE8/$0AEA/$0AF4. Tables read DB-relative: $9386, $95E4, $9842 (x2), $848C, $849C, $84A2, $85A2, $8484, $85C2, $85CE.
For the spec step, things noticed (verify against the trace): (a) LDX $8C at $86CC runs with D=$0A00, so it reads $0A8C, not $008C. (b) $0AEC/$0AF0/$0AF6 adds have no CLC: carry comes from the preceding ASL (bit 15 of the source word); the following ADC #$0200 chains carry from that add. $0ACE likewise relies on C=0 from REP #$31. (c) With X 8-bit, the $0109*2 index truncates to 8 bits and $7E:C015 is read through TAX (high byte lost) and written back zero-extended. (d) $7E:C00F wraps to 0 only when it hits exactly $0C00. (e) Absolute reads/writes depend on DB; Reset never sets DB, and DB on return from 0080b5 is assumed to be $00 but not proven here.
"""
