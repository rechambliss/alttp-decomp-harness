done = "Mapped and specced earlier (run-2026-10-10-c). Translated (specced -> translated, run-2026-10-10-c): prep_frame_uploads(s, rom) in bank00/prep_frame_uploads.rs, one statement group per instruction with full N/V/Z/C tracking; spec and asm agree, no discrepancies. Both PHDs push to the real stack (2 bytes below S written). Abs reads go through DB as 24-bit addresses (abs,X carries into DB+1); dp through D. Added wram::addr OAM_BUFFER_HIGH, OAM_EXT_BITS, FRAME_UPLOAD_PTRS, ANIM_TILE_TIMER_A/OFS_A/TIMER_B/IDX_B. Asserts decimal flag clear at entry (binary ADC only). 13 tests with a synthetic hashed ROM (no ROM bytes): 200 random states vs an independent spec-formula model (whole 128 KiB WRAM, A/X/Y/P, S/D/DB), plus each test_state: bit bleed, both timers incl. 0 underflow, $C00F wrap/off-grid/$FE00, $C015 wrap/$FF0A/odd/$FE, $0A8C vs $008C decoy, carry chains, $0109 bit 7 + $010A, PLD N/Z, bank-carry of $9386+X. cargo test -p alttp-core passes (33 tests), clippy clean."
uncertain = "DB=$00 at entry is assumed (Reset never sets it; modules dispatched by 0080b5 not checked for leaving DB changed). Meaning of the pointers and counters is still a guess (likely NMI DMA sources / animated tiles)."
next_check = "Verifier: call with a closure over alttp_rom::Rom::read_u8 for the real tables, DB=$00. Diff $0A00-$0A1F, $0AC0-$0AF9, $7E:C00D-$C016 and the 2 stack bytes; include $C00D=1 and $C013=1 frames and a $0A8C=$B5 case with $008C different."
