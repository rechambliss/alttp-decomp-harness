[handoff]
done = "Translated IRQ instruction by instruction (recomp 9e2ecbd). irq(&mut State) takes s.cpu as at $00:82D8 (hardware frame P/PC/PB already pushed, PB=0) and leaves s.cpu as RTI resumes it. Stack is modelled in WRAM via bank $00, so the 9-byte push frame and the PHK/PLB $00 byte at entry S-9 are real WRAM writes. All spec test_states covered by 8 unit tests in irq.rs; cargo test -p alttp-core passes. Spec and asm agree; no discrepancies."
uncertain = "Shared infra was created here because none existed (see followups). HW read model: $4211/$4212 values come from HwInputs::read_seq; the last value repeats, so a harness ending a $4212 sequence without bit 6 hangs, as on hardware. Intermediate N/Z/V flag updates are modelled but dead (RTI restores P)."
next_check = "Verifier: diff WRAM including the stack page (entry S-9..entry S are written; on the thread path they must match as the suspended frame) and the hw write log. Reference needs $4211/$4212 read values injected. Blocked on O-001 for the reference emulator."
