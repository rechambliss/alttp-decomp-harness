id = "0082d8"
name = "IRQ"
address = "$00:82D8"
status = "translated"
owner = ""
blocked_reason = ""
notes = """
Native-mode IRQ vector target, read from header at $00:FFEE.
Entry width: whatever the interrupted code had (native IRQ pushes P, does not change M/X), so it varies.
It does not matter: SEI and REP #$30 are width-independent. Traces at m8x8 and m16x16 are identical apart from the header line.
Same frame as NMI: REP #$30, push A/X/Y (16-bit), D, DB; PHK/PLB sets DB=$00; SEP #$30. D is NOT reset (PHD only, no TCD), unlike NMI. Body runs at m8x8.
Three paths, all exit by RTI after REP #$30 + PLB/PLD/PLY/PLX/PLA (16-bit pulls):
- $012A != 0: jump to $00:831F. Reads $4211 (ack), swaps S with the word at $1F0A (TSC/TAX, LDA $1F0A/TCS, STX $1F0A), pulls, RTI at $00:8332.
  Same thread-switch sequence as NMI's alt path at $00:822D, so it returns into the other stack.
- $012A == 0 and ($4211 bit 7 clear, or $0128 == 0): straight to the pulls at $00:8317, RTI at $00:831E. The $4211 read is the ack either way.
- $012A == 0, $4211 bit 7 set, $0128 != 0: spin on $4212 bit 6 (HBlank), write $0630/$0631 to $2111 (BG3HOFS low/high), STZ $2112 twice (BG3VOFS = 0).
  Then if $0128 bit 7 set: STZ $0128 and $4200 = $81 (NMI + auto-joypad, IRQs off). Falls into the pulls at $00:8317.
No callees, no jump tables, no indirect jumps. 49 insns, one contiguous range.
ROM byte search for JMP/JSR/JSL/JML to $82D8/$82E9/$82F3/$8317/$831F in bank $00: only 3 hits, all in data
(two '22 17 83 00' inside bank $0B tables at $0B:F04D/$0B:F365, one '20 1F 83' at $14:A5FB which would target bank $14). Treated as coincidental.
"""
followups = [
  { address = "shared", reason = "0082d8 translation added shared, additive-only infrastructure in alttp-core (no existing behavior changed): cpu.rs (Cpu regs, flag consts, bank0_wram, push/pull, rep/sep, native rti), State.cpu, Hw::r8 + HwInputs::read_seq/set_reads (per-address read sequences, last value repeats, panics if none supplied) + Hw.reads log, wram::addr constants. Reviewer should sign off on these as the shared shape for NMI and later units." },
  { address = "$00:80C9", reason = "NMI spec: IRQ is the second half of the $1F0A thread switch. Both NMI ($00:822D) and IRQ ($00:831F) swap S with $1F0A when $012A != 0; the spec for either should describe the pair together." },
]

[map]
bounds = ["$00:82D8-$00:8332"]
mx_entry = "varies: see notes"
callees = []
jump_tables = []
size_insns = 49
merged_into = ""

[spec]
summary = """
H/V-IRQ handler. Saves A/X/Y (16-bit), D, DB; sets DB=$00 (D left as interrupted, unused); body at m8x8.
Thread mode ($012A != 0): acks $4211 and swaps S with $1F0A, returning into the other stack (pairs with NMI's alt path; NMI arms this IRQ at line [$FF]).
Otherwise acks $4211; if it was a real timer IRQ (bit 7) and $0128 != 0, waits for HBlank and loads BG3HOFS from $0630/$0631 and BG3VOFS = 0 (mid-screen BG3 split, NMI arms it at line $80).
If $0128 bit 7 is set the split is one-shot: clears $0128 and writes $4200 = $81 (V-IRQ off). Restores registers and RTI.
"""
inputs = [
  "CPU state of the interrupted code: A, X, Y (full 16 bits), D, DB, P, PB:PC (pushed or already on the stack, restored on exit)",
  "S at entry (the native interrupt frame P, PCL, PCH, PB is already on the stack)",
  "WRAM $7E:012A NMI_ALT_THREAD (u8): path select, read via DB=$00 (absolute $012A)",
  "HW read $4211 TIMEUP: every path reads it once (ack). Value used only on the non-thread path (bit 7 = timer IRQ flag)",
  "WRAM $7E:0128 IRQ_ENABLE_REQ (u8): non-thread path, only when $4211 bit 7 set; read twice (zero test, then bit 7 test after the split)",
  "HW read $4212 HVBJOY bit 6 (HBlank), polled in a loop until set: split path only",
  "WRAM $7E:0630/$0631 IRQ_BG3HOFS (u8 each): split path only",
  "WRAM $7E:1F0A ALT_THREAD_SP (u16) and the other thread's 13-byte frame at [$1F0A]+1: thread path only",
]
outputs = [
  "Non-thread paths: A, X, Y, D, DB, P, PB:PC and S restored exactly to the interrupted values (RTI).",
  "Thread path: S = old [$1F0A] + 13; A, X, Y, D, DB, P, PB:PC are pulled from that other stack. [$1F0A] = entry S - 9 (S after the 9-byte push).",
  "WRAM $7E:0128 = 0 when the split ran and $0128 bit 7 was set; unchanged otherwise",
]
hw_writes = [
  "Order matters.",
  "All paths: read $4211 first (ack). Thread path: no hw writes at all.",
  "Split path ($012A == 0, $4211 bit 7 set, $0128 != 0): poll $4212 until bit 6 set, then",
  "  $2111 BG3HOFS x2 = $0630, $0631; $2112 BG3VOFS x2 = $00, $00;",
  "  then only if $0128 bit 7 set: $4200 NMITIMEN = $81 (after STZ $0128)",
  "Ack-only path ($012A == 0 and ($4211 bit 7 clear or $0128 == 0)): no hw writes.",
]
scratch = [
  "Stack bytes entry S-8..entry S (the 9-byte A/X/Y/D/DB push frame): dead after the non-thread RTI. On the thread path they stay live as the suspended thread's saved frame, so do not ignore them there.",
]
quirks = [
  "SEI is redundant (native interrupt entry already sets I). Keep it; no observable effect.",
  "Unlike NMI, D is pushed/pulled but never set to 0. The body uses only absolute addressing, so D has no effect; do not add a TCD.",
  "SEP #$30 after the pushes zeroes the high bytes of X and Y. Harmless: the 16-bit pulls restore them. On the thread path TSC/TAX happen after REP #$30, so the full 16-bit S is saved.",
  "Thread path does not test $4211 bit 7 and ignores $0128: any IRQ (or spurious IRQ) while $012A != 0 swaps stacks.",
  "The $4211 read happens on every path, including the thread path (at $00:831F, before REP). It is the only ack; the split path's bit-7 test uses that same read.",
  "If $4211 bit 7 is clear (not a timer IRQ) the split is skipped even when $0128 != 0, and $0128 is not cleared.",
  "$0128 nonzero with bit 7 clear: the split runs and IRQs stay enabled (NMI re-arms V-IRQ every frame anyway). Bit 7 set: one-shot, STZ $0128 then $4200=$81 (NMI + auto-joypad, V-IRQ off).",
  "$0128 is read twice: the bit-7 test reads it again after the $2112 writes, not the value tested before the HBlank wait.",
  "HBlank wait is an unbounded spin on $4212 bit 6 (BIT/BVC). A harness must supply a $4212 value with bit 6 set (or a sequence ending in one) or it hangs.",
  "BG3VOFS is always zeroed (two STZ), not loaded from a mirror. Only BG3HOFS comes from $0630/$0631.",
  "The 13-byte frame layout (top to bottom: DB, D lo/hi, Y lo/hi, X lo/hi, A lo/hi, P, PCL, PCH, PB) must match NMI's alt path exactly; the swap code is identical to NMI's $00:822D sequence apart from NMI not reading $4211 there.",
]
test_states = [
  "Thread path: $012A=1, $1F0A pointing at a prepared 13-byte frame in another stack area; $4211 readback both $80 and $00 (same result). Check $4211 read, no hw writes, new S, [$1F0A] = entry S - 9, registers/P/PC pulled from the frame.",
  "Ack-only, not a timer IRQ: $012A=0, $4211 readback $00, $0128=$80. No writes, $0128 unchanged, exact register restore.",
  "Ack-only, $0128=0: $012A=0, $4211 readback $80. No writes, $4212 never read.",
  "Split, repeating: $012A=0, $4211=$80, $0128=$01, $0630/$0631=$34/$12, $4212 readback $40. Writes $2111=$34,$12; $2112=0,0; no $4200; $0128 stays $01.",
  "Split, one-shot: as above with $0128=$80 (and $FF). Same writes then $4200=$81, $0128=0.",
  "HBlank spin: $4212 sequence $00,$00,$40 (and $80 then $40: bit 7 alone must not exit). Split writes only after bit 6 seen.",
  "Entry with interrupted P at m8x8 and at m16x16, A/X/Y with nonzero high bytes, D!=0, DB!=0: identical behavior, everything restored by RTI.",
]
