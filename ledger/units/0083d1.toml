ROM byte search of bank 00 for JSR/JMP/JML/JSR (abs,X)/JMP (abs,X) with operand $83D1 finds only $00:8141; no JSL hits in the whole ROM.
Straight-line leaf: no branches, no callees, no tables, no width changes (no REP/SEP). Single exit RTS at $00:83F8, m8x8.
Width-sensitive: all loads/stores and TAY/STY assume M=1, X=1 (8-bit). NMI's 0089e0 return width is still an open followup on 0080c9.
Merge decision: not merged into 0080c9. 20 insns is not under the ~20 threshold, 0080c9 is already specced with 0083d1 as a stubbed callee, and pointer-table references are not ruled out. Same call as the 0080c9 map.
