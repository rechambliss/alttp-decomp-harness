id = "0083d1"
name = "ReadJoypad"
address = "$00:83D1"
status = "specced"
owner = ""
blocked_reason = ""
notes = """
Only caller: JSR at $00:8141 in NMI (0080c9), at m8x8, only on the path where $12 was zero (after 0089e0 returns).
ROM byte search of bank 00 for JSR/JMP/JML/JSR (abs,X)/JMP (abs,X) with operand $83D1 finds only $00:8141; no JSL hits in the whole ROM.
Straight-line leaf: no branches, no callees, no tables, no width changes (no REP/SEP). Single exit RTS at $00:83F8, m8x8.
Width-sensitive: all loads/stores and TAY/STY assume M=1, X=1 (8-bit). NMI's 0089e0 return width is still an open followup on 0080c9.
Merge decision: not merged into 0080c9. 20 insns is not under the ~20 threshold, 0080c9 is already specced with 0083d1 as a stubbed callee, and pointer-table references are not ruled out. Same call as the 0080c9 map.
Touches: STZ $4016 (JOYSER0), reads $4218/$4219 (JOY1L/JOY1H auto-read), writes dp $00/$01, $F0/$F2/$F4/$F6/$F8/$FA, reads old $F8/$FA.
"""
followups = []

[map]
bounds = ["$00:83D1-$00:83F8"]
mx_entry = "m8x8"
callees = []
jump_tables = []
size_insns = 20
merged_into = ""

[spec]
summary = """
Reads controller 1 from the auto-joypad registers once per non-lag NMI. Writes 0 to $4016 first, then reads JOY1L ($4218) and JOY1H ($4219).
Stores raw bytes to dp $00/$01 and to the held bytes $F2 (low: A X L R) and $F0 (high: B Y Sel Start U D L R).
New-press bytes are (raw XOR prev) AND raw: $F6 from $4218 vs old $FA, $F4 from $4219 vs old $F8. Then prev bytes $FA/$F8 get the raw values.
Runs with D=$0000, DB=$00 (set by NMI 0080c9). m8x8 in and out, straight line, single RTS.
"""
inputs = [
  "M=1, X=1 (8-bit) at entry; D=$0000, DB=$00 (NMI sets both)",
  "HW read $4218 JOY1L (u8), read first",
  "HW read $4219 JOY1H (u8), read second",
  "WRAM $7E:00FA JOY1_PREV_AXLR (u8), old value",
  "WRAM $7E:00F8 JOY1_PREV_BYSTUDLR (u8), old value",
  "X register: not read, passes through unchanged",
  "C, V flags: not touched, pass through",
]
outputs = [
  "WRAM $7E:0000 = raw $4218 (u8)",
  "WRAM $7E:0001 = raw $4219 (u8)",
  "WRAM $7E:00F2 JOY1_HELD_AXLR = raw $4218",
  "WRAM $7E:00F6 JOY1_NEW_AXLR = ($4218 XOR old $FA) AND $4218",
  "WRAM $7E:00FA JOY1_PREV_AXLR = raw $4218",
  "WRAM $7E:00F0 JOY1_HELD_BYSTUDLR = raw $4219",
  "WRAM $7E:00F4 JOY1_NEW_BYSTUDLR = ($4219 XOR old $F8) AND $4219",
  "WRAM $7E:00F8 JOY1_PREV_BYSTUDLR = raw $4219",
  "A (u8) = value stored to $F4; B (high byte of A) unchanged",
  "Y (u8) = raw $4219 (YH stays 0 since X=1)",
  "X unchanged",
  "N, Z = from the final AND (i.e. of the $F4 value); C, V, D, I flags unchanged",
  "M=1, X=1 at exit",
]
hw_writes = [
  "$4016 JOYSER0 <- $00 (STZ), before both reads",
  "Order: write $4016, read $4218, read $4219",
]
scratch = []
quirks = [
  "STZ $4016 clears the manual-read latch even though the routine uses auto-joypad results; reproduce the write, do not drop it.",
  "No wait on $4212 auto-read busy bit: the values read are whatever $4218/$4219 hold at that moment. Faithful translation reads them unconditionally.",
  "Only controller 1 is read; $421A-$421F are untouched.",
  "Old prev values ($FA, $F8) are read before being overwritten; the low byte pair is fully processed before $4219's value is used, but both HW reads happen up front.",
  "$00/$01 are left holding the raw pad bytes. Treated as outputs (not scratch) until later readers are ruled out; see 0080c9 which does LDA $012A next without touching them.",
]
test_states = [
  "No branches, so any state exercises the whole routine. Vary inputs to check the bit math:",
  "Nothing pressed: $4218=$4219=0, prev=0 -> all outputs 0, A=0, Z=1.",
  "New press: $4219=$80 (B), old $F8=$00 -> $F4=$80, A=$80, N=1; $4218=$C0 (A,X) with old $FA=$40 -> $F6=$80.",
  "Held, not new: raw == prev (e.g. $4219=$FF, $F8=$FF) -> $F4=0, Z=1.",
  "Release: raw=$00, prev=$FF -> new byte 0 (XOR gives $FF, AND raw gives 0).",
  "Random: random $4218/$4219/$F8/$FA plus random X, B (A high byte) and C/V flags to confirm pass-through.",
]

