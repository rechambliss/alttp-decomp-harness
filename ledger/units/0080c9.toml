[handoff]
done = "Mapped (earlier session) and specced NMI: full hw write order for both paths, APU port 0-3 queue logic with its echo-clear and stuck-request quirks, $12 lag-frame skip, V-IRQ arm differences, and the exact 13-byte frame swapped through $1F0A on the alt path."
uncertain = "0089e0 return width still open (table at $00:8C6E undecoded); spec assumes m8x8. Who seeds $1F0A and sets $012A is unconfirmed (byte-search candidates in followups). Meaning of $0130 vs $0133 split at $F2 is a guess."
next_check = "Translator: model APU port reads ($2140/$2141) and $4210/$4211 as hw reads with test-supplied values. Alt-path tests need a hand-built 13-byte frame at [$1F0A]+1. Mapping 0089e0 should confirm its exits return at m8x8 before verification."
