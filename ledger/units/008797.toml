[spec]
summary = """
Reset-time clear of low WRAM plus SRAM sanity fixes. Saves the word at $01FE (its own return address) in Y, then zeroes $7E:0000-$1FFF
with a 16-bit loop over 8 parallel $400-byte blocks (X = $03FE down to 2), which skips the first word of each block.
Zeroes the words $7E:C500 and $70:1FFE. For each save slot marker word $70:03E5/$70:08E5/$70:0DE5, zeroes it unless it equals $55AA.
Restores $01FE from Y, writes 16-bit 0 to $212E/$212F, then in 8-bit mode sets $13 = $80 and increments $15 (0 -> 1).
Entry and exit m8x8, body m16x16. Single RTS. Absolute stores rely on DB=$00 and dp stores on D=$0000.
"""
inputs = [
  "M=1, X=1 at entry; D=$0000, DB=$00 (reset values on the only call path, Reset init $00:802C)",
  "WRAM $7E:01FE (u16): caller's JSR return address, saved and restored",
  "SRAM $70:03E5 (u16) slot 1 marker, compared to $55AA",
  "SRAM $70:08E5 (u16) slot 2 marker, compared to $55AA",
  "SRAM $70:0DE5 (u16) slot 3 marker, compared to $55AA; also decides final B and C",
  "WRAM words $7E:0000, $0400, $0800, $0C00, $1000, $1400, $1800, $1C00 (u16 each): not touched, pass through",
  "A, X, Y on entry: not read (all overwritten)",
  "V, D, I flags: not touched, pass through",
]
outputs = [
  "WRAM $7E:0002-$03FF, $0402-$07FF, $0802-$0BFF, $0C02-$0FFF, $1002-$13FF, $1402-$17FF, $1802-$1BFF, $1C02-$1FFF = $00, except as below",
  "WRAM $7E:01FE-$01FF = their original values (zeroed by the loop, then restored 16-bit from Y)",
  "WRAM $7E:0013 INIDISP_MIRROR = $80",
  "WRAM $7E:0015 UNKNOWN_15 = $01 (zeroed by loop, then INC)",
  "WRAM $7E:C500-$C501 = $0000",
  "SRAM $70:1FFE-$1FFF = $0000",
  "SRAM $70:03E5 (u16) = unchanged if it was $55AA, else $0000; same rule for $70:08E5 and $70:0DE5 independently",
  "A low byte = $80; B (A high byte) = $55 if $70:0DE5 was $55AA, else $00",
  "X = $00 (XH cleared by SEP #$30)",
  "Y = low byte of the original $01FE word (YH cleared by SEP #$30)",
  "N=0, Z=0 (from INC $15 result $01)",
  "C = 1 if original $70:0DE5 word >= $55AA unsigned, else 0 (from the last CMP; nothing after it touches C)",
  "M=1, X=1 at exit",
]
hw_writes = [
  "$212E TMW <- $00 and $212F TSW <- $00 (single 16-bit STZ $212E, low byte to $212E first), after all WRAM/SRAM work",
]
scratch = []
quirks = [
  "Loop runs X = $03FE down to 2 and exits at X=0 without storing, so the words at $0000, $0400, $0800, $0C00, $1000, $1400, $1800, $1C00 (16 bytes total) are never cleared. Reproduce; do not clear them.",
  "The loop zeroes the whole stack page including the return address at $01FE-$01FF; only that word is restored. Anything else the caller had on the stack ($0100-$01FD) is wiped. On the real path S=$01FD so nothing else is live.",
  "Stores to $0000-$1FFF use bank-0 absolute addressing; they hit WRAM only because DB=$00 (low-RAM mirror).",
  "$13 and $15 are written after the clear, so their final values are fixed ($80, $01) regardless of prior contents.",
  "SRAM markers are only invalidated (zeroed), never set. Each of the three slots is checked independently.",
  "Leftover register state is observable: B depends on the last SRAM marker and C on the last CMP. Reproduce exactly.",
  "STZ $212E is 16-bit, so it also writes $212F.",
]
test_states = [
  "All three SRAM markers = $55AA: no marker writes; B=$55, C=1.",
  "All three markers != $55AA (e.g. $0000, $1234, $FFFF): all three zeroed; B=$00; C=1 for $FFFF (>= $55AA), C=0 for $1234 or $0000.",
  "Mixed: slot 1 = $55AA, slot 2 = $AA55, slot 3 = $55AA -> only slot 2 zeroed; covers each branch both ways across states.",
  "Fill $7E:0000-$1FFF and $7E:C500/$70:1FFE with random nonzero bytes to confirm the 8 untouched words keep their values and everything else in range clears.",
  "Vary the $01FE word (e.g. $802E, $ABCD) to check the restore and the Y low byte.",
  "Random V, D, I flags and random A/X/Y on entry to confirm pass-through and overwrite.",
]

