id = "0080b5"
name = "MainModuleDispatch"
address = "$00:80B5"
status = "mapped"
owner = ""
blocked_reason = ""
notes = """
Only caller: Reset at $00:8056 (JSL). Whole-ROM byte scan found no other JSL/JML/JSR/JMP to $80B5. Entry m8x8 from Reset's loop; no REP/SEP inside.
8 instructions, straight line: Y = $10; $03 = $8061[Y], $04 = $807D[Y], $05 = $8099[Y] (lo, hi, bank); JML [$0003]. No RTS/RTL of its own.
The three tables are 28 bytes each and contiguous: $8061+28=$807D, $807D+28=$8099, $8099+28=$80B5 (the entry). So N=28 comes from the spacing, not a guess.
The tool's WARN on JML [$0003] is resolved by decoding the split table (--split-table $00:8061,$00:807D,$00:8099=28).
Duplicate targets: modules $08 and $0A both go to 0283b9, modules $09 and $0B both go to 02a482. 26 distinct targets, each with a new unit file.
Table reads are LDA abs,Y, so they use DB. DB=$00 from Reset (never set there), which is what puts the tables in bank 00.
Y is 8-bit, so $10 >= 28 reads past the tables (into the next table or the code at $80B5). No bounds check. Unknown whether the game ever does that.
Exit: the JML is a tail jump into the module. The module's RTL returns to Reset at $00:805A using Reset's JSL frame, so every module must end at m8x8 (see 008000 followup).
Not merged into Reset despite <20 insns and one caller: methodology says a jump table dispatcher is its own unit.
Trace command: cargo run -q -p alttp-disasm -- trace 00:80B5 --mx m8x8 --split-table '$00:8061,$00:807D,$00:8099=28'
"""
