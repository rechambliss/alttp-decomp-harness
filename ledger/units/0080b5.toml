id = "0080b5"
name = "MainModuleDispatch"
address = "$00:80B5"
status = "specced"
owner = ""
blocked_reason = ""
notes = """
Only caller: Reset at $00:8056 (JSL). Whole-ROM byte scan found no other JSL/JML/JSR/JMP to $80B5. Entry m8x8 from Reset's loop; no REP/SEP inside.
8 instructions, straight line: Y = $10; $03 = $8061[Y], $04 = $807D[Y], $05 = $8099[Y] (lo, hi, bank); JML [$0003]. No RTS/RTL of its own.
The three tables are 28 bytes each and contiguous: $8061+28=$807D, $807D+28=$8099, $8099+28=$80B5 (the entry). So N=28 comes from the spacing, not a guess.
The tool's WARN on JML [$0003] is resolved by decoding the split table (--split-table $00:8061,$00:807D,$00:8099=28).
Duplicate targets: modules $08 and $0A both go to 0283b9, modules $09 and $0B both go to 02a482. 26 distinct targets, each with a new unit file.
Table reads are LDA abs,Y, so they use DB. DB=$00 from Reset (never set there), which is what puts the tables in bank 00.
Y is 8-bit, so $10 >= 28 reads past the tables (into the next table or the code at $80B5). No bounds check. Unknown whether the game ever does that.
Exit: the JML is a tail jump into the module. The module's RTL returns to Reset at $00:805A using Reset's JSL frame, so every module must end at m8x8 (see 008000 followup).
Not merged into Reset despite <20 insns and one caller: methodology says a jump table dispatcher is its own unit.
Trace command: cargo run -q -p alttp-disasm -- trace 00:80B5 --mx m8x8 --split-table '$00:8061,$00:807D,$00:8099=28'
"""
followups = [
  { address = "$00:8056", reason = "008000's followup on $00:80B5 is answered by this map (table decoded, 28 entries). Whether each module returns via RTL at m8x8 is still open and moves to the 26 target units." },
]

[map]
bounds = ["$00:80B5-$00:80C8"]
mx_entry = "m8x8"
callees = []
jump_tables = [{ at = "$00:8061", entries = 28, targets = ["0cc120", "0cccdf", "0cd072", "0cd4a4", "0cd8a9", "028130", "028218", "02879c", "0283b9", "02a482", "0283b9", "02a482", "029920", "02993d", "00f800", "029987", "029adc", "029afe", "09f2a0", "029c4f", "0cedcc", "029d01", "029e8f", "09f7af", "029ee1", "029ff1", "0e986e", "028580"] }]
size_insns = 8
merged_into = ""

[spec]
summary = """
Per-frame main-module dispatcher. Reads the module number from $10, looks up the module's
24-bit entry address in three parallel byte tables in bank 00 (lo $8061, hi $807D, bank $8099),
stores it at $03-$05 and tail-jumps there with JML [$0003]. The module's RTL returns straight
to Reset's loop ($00:805A). No bounds check on $10.
"""
inputs = [
  "WRAM $7E:0010 MODULE_INDEX (u8), read via DP (D=$0000) into Y",
  "DB = $00 (table reads are LDA abs,Y in data bank DB)",
  "D = $0000 (STA $03/$04/$05 are DP writes; JML [$0003] always reads bank 00 $0003, so the two only agree when D=0)",
  "CPU width m8x8 (P.M=1, P.X=1)",
  "ROM $00:8061-$00:80B4 (three 28-byte tables) and, for out-of-range indices, bytes up to $00:8198",
]
outputs = [
  "WRAM $7E:0003 DISPATCH_PTR lo = Lo[$10] (u8)",
  "WRAM $7E:0004 DISPATCH_PTR hi = Hi[$10] (u8)",
  "WRAM $7E:0005 DISPATCH_PTR bank = Bank[$10] (u8)",
  "Y = $10 (u8; high byte of Y is 0 since X=1)",
  "A low byte = Bank[$10]; B (A high byte) unchanged",
  "X, D, DB, S unchanged; P: N/Z from the last LDA (the bank byte), other flags unchanged",
  "PC/PB = the 24-bit address at $03-$05 (tail jump, no return to this routine)",
]
hw_writes = []
scratch = []
quirks = [
  "No bounds check: $10 >= $1C reads past each table. each read is just ROM bank 00 at table+Y, so Lo[28..55] = Hi[0..27], Lo[56..83] = Bank[0..27], Hi[28..55] = Bank[0..27], and anything at or past $00:80B5 is this routine's own code bytes and what follows. Reproduce as a raw byte read of ROM bank 00 at table+Y, not a Rust array index that panics.",
  "Duplicate table entries: modules $08 and $0A both go to $02:83B9, modules $09 and $0B both go to $02:A482. Keep both entries; do not dedupe the table.",
  "Tail jump, not a call: it pushes nothing. The module's RTL uses Reset's JSL frame, so in Rust the module must be called in place of this routine and its return goes back to Reset.",
  "$03-$05 keep the module entry address after the jump; modules may read or overwrite them, so the write must happen before the module runs.",
  "Tables are read through DB, not a long address. DB is $00 from reset and never changed on this path.",
]
test_states = [
  "Each valid $10 from $00 to $1B with D=0, DB=0, m8x8: check $03-$05, A, Y and the jump target (28 states; include $08/$0A and $09/$0B to confirm duplicates).",
  "Out-of-range $10 = $1C, $37, $38 and $FF: check $03-$05 hold the overflow bytes from the next table or the code at $80B5 (stop before executing the bogus target).",
  "Nonzero B (e.g. A=$01xx as Reset leaves it) and an arbitrary X: confirm B and X are preserved.",
]

