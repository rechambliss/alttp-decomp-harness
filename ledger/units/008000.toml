[handoff]
done = "Specced Reset from a fresh local trace (matches the map). Hw write order, CPU state at the first call (incl. B=$01, DB untouched), loop order and lag-frame behavior written up."
uncertain = "Still assumes every callee returns at m8x8 (0080b5 modules via RTL, 0088d8 via 00885f). Who sets $12 is unconfirmed (probably NMI, unit 0080c9). Whether $00:803B-$8050 is reachable from elsewhere is still unchecked."
next_check = "Translator: model Reset as init() plus a loop step fn so tests can stop at $00:8034 or after N passes; stub callees. Resolve the 0080b5 and 00885f followups before 008000 is verified. Verifier needs O-001."
