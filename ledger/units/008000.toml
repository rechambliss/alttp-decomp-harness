id = "008000"
name = "Reset"
address = "$00:8000"
status = "specced"
owner = ""
blocked_reason = ""
notes = """
Emulation-mode RESET vector target, read from header at $00:FFFC.
Entry width m8x8 is forced by hardware: the 65816 resets in emulation mode (E=1, M=1, X=1).
Never returns. Init runs once, then an endless main loop at $00:8034.
Mode switch at $00:801B-$801C: carry is cleared immediately before the exchange, so the CPU always lands in native mode (E=0). This resolves the tool's XCE WARN.
It then clears M and the decimal flag, sets the direct page register to $0000 and the stack pointer to $01FF, and sets M and X back to 8-bit before the first call.
Main loop: wait until $12 is nonzero, enable IRQs, then branch over $00:803B-$8050 to $00:8051. The skipped bytes are not reachable from Reset (see followups).
Loop body, in order: increment $1A, call 00841e, long-call 0080b5, call 0085ec, clear $12, return to the wait.
Callee return widths: 00841e, 0085ec and 008797 each exit through a single RTS at m8x8 (traced locally this session).
0088d8 returns through RTS at m8x8 if its callee 00885f preserves M/X. 0080b5 ends in JML [$0003], so its return width depends on each dispatched module.
The loop code after $00:805A (clearing $12, then reading $12 and incrementing $1A next pass) is width-sensitive, so every dispatched module must return with M=8 and X=8.
Tool summary listed callee 0080b5 as a JSL target in bank 00; it returns to $00:805A via the module's RTL.
No jump tables in this unit. Size 32 instructions. Not merged: it is a vector entry, not a single-caller helper.
"""
followups = [
  { address = "$00:80B5", reason = "Dispatcher: uses $10 as an index to build a 24-bit pointer at $03-$05 from three parallel byte tables at $00:8061, $00:807D, $00:8099, then long-jumps through it. Tool --table does not decode split byte tables. Each target is its own unit. Confirm every target returns via RTL at m8x8; Reset's loop depends on it." },
  { address = "$00:885F", reason = "Callee of 0088d8. Confirm it preserves M/X so 0088d8 returns to Reset at m8x8." },
  { address = "$00:803B", reason = "Bytes $00:803B-$8050 are skipped by the branch at $00:8039 and unreachable from Reset. They read $F6 and $0FD7 and branch to $8051 or $805A. Check whether any other code reaches them before treating them as dead." },
]

[map]
bounds = ["$00:8000-$00:803A", "$00:8051-$00:8060"]
mx_entry = "m8x8"
callees = ["0080b5", "00841e", "0085ec", "008797", "0088d8"]
jump_tables = []
size_insns = 32
merged_into = ""

[spec]
summary = """
Cold-start entry. With IRQs masked, disables NMI/IRQ/auto-joypad, HDMA and DMA, zeroes the four APU ports and forces blank.
Switches to native mode, clears decimal, sets D=$0000 and S=$01FF, then runs two init calls (0088d8, 008797) at m8x8.
Enables NMI plus auto-joypad read ($4200=$81) and enters an endless loop: spin until $12 is nonzero, CLI,
bump the frame counter $1A, run 00841e, the module dispatcher 0080b5 (JSL) and 0085ec, clear $12, repeat. Never returns.
"""
inputs = [
  "CPU reset state: E=1, M=1, X=1, I=1, PB=$00, DB=$00 (forced by hardware)",
  "WRAM $7E:0012 FRAME_READY (u8), read via DP $12 each wait iteration",
  "WRAM $7E:001A FRAME_COUNTER (u8), read-modify-write once per pass",
]
outputs = [
  "E=0 (native), M=1, X=1, D flag=0, I=1 during init then I=0 from the first loop pass on",
  "D register = $0000, S = $01FF (set once, then balanced by the calls)",
  "B (high byte of A) = $01 at the first call to 0088d8, left over from LDA #$01FF",
  "DB not written here; stays $00 from reset",
  "WRAM $7E:001A FRAME_COUNTER += 1 per pass (8-bit wrap)",
  "WRAM $7E:0012 FRAME_READY = 0 at the end of each pass",
]
hw_writes = [
  "$4200 NMITIMEN = $00",
  "$420C HDMAEN = $00",
  "$420B MDMAEN = $00",
  "$2140 APUIO0 = $00",
  "$2141 APUIO1 = $00",
  "$2142 APUIO2 = $00",
  "$2143 APUIO3 = $00",
  "$2100 INIDISP = $80 (forced blank, brightness 0)",
  "(callees 0088d8 then 008797 run here)",
  "$4200 NMITIMEN = $81 (NMI on, auto-joypad read on, H/V IRQ off)",
  "Order matters: all writes above happen with I=1, before any call, and $4200=$81 comes after both init calls.",
]
scratch = []
quirks = [
  "REP #$28 clears both M and the decimal flag; X stays 8-bit the whole time (no 16-bit index use).",
  "B is left at $01 by LDA #$01FF/TCS and is not cleared by SEP #$30. Reproduce it: 0088d8 is entered with A=$01FF (16-bit view).",
  "DB is never set by Reset. DP accesses to $12/$1A hit the low-WRAM mirror at $00:0012/$00:001A.",
  "CLI runs on every loop pass, not once. IRQs stay masked through all of init and until $12 first becomes nonzero.",
  "$1A is incremented before the frame work, so the first pass sees $1A = initial+1.",
  "STZ $12 comes after 0085ec. If $12 is set again while the frame work is still running (lag frame), that set is wiped and the loop waits for the next one. Keep this lag behavior.",
  "The BRA at $00:8039 always skips $00:803B-$8050. Do not translate those bytes as part of Reset.",
  "Callees are assumed to return with M=1, X=1 (open followups on 0080b5 and 00885f). Reset does no SEP before using $12/$1A after the calls.",
]
test_states = [
  "Cold reset from power-on state (E=1, M=X=I=1): check the hw write sequence and CPU state (E, P, D, S, A incl. B) at the first JSR $88D8. Stop condition for the init half.",
  "Callees stubbed to RTS/RTL at m8x8: run until the first arrival at $00:8034, check $4200=$81 written last and I still set.",
  "Loop with $12 = 0 and NMI held off: N wait iterations, no RAM or hw writes, $1A unchanged.",
  "Loop with $12 = nonzero at entry to $00:8034: one pass; $1A += 1, $12 = 0, I cleared, callees called in order 00841e, 0080b5, 0085ec.",
  "$1A = $FF before a pass: wraps to $00.",
  "$12 set by a stub inside 0085ec (simulated lag): after the pass $12 = 0 and the loop spins again.",
]

