[spec]
summary = """
Hides every sprite in the OAM low-table shadow buffer by setting the Y byte of all 128 entries
($7E:0801 + 4n, n = 0..127) to $F0. Saves D, then four passes with X = $60, $40, $20, $00: each pass
sets D = $0800 and writes 16 bytes via dp,X, then sets D = $0900 and writes 16 more. Restores D, RTS.
Called once per frame by Reset's main loop before the module runs. X, Y, tile and attr bytes untouched.
"""
inputs = [
  "D (u16), saved and restored; its value does not affect the writes (D is set to $0800/$0900 before every store)",
  "CPU width m8x8 (P.M=1, P.X=1); E=0 (native mode)",
  "S: one 2-byte push/pull of D, net zero",
]
outputs = [
  "WRAM $7E:0801 + 4n for n = 0..127 (i.e. $0801,$0805,..,$08FD and $0901,$0905,..,$09FD) = $F0 (128 bytes, OAM_BUFFER_LOW Y bytes)",
  "A = $09E0 (A low = $E0 from the final TXA/SBC; B = $09 left by the last XBA/TCD setup)",
  "X = $00E0 (X high stays 0 since X=1)",
  "Y, DB, S unchanged; D = entry value",
  "P: N/Z from PLD (16-bit restored D: Z=1,N=0 when D=$0000 as Reset uses), C=0 (borrow from $00-$20), V=0, M=1 X=1, I/D unchanged",
]
hw_writes = []
scratch = []
quirks = [
  "Exit N/Z come from PLD (it sets N/Z from the full 16-bit D pulled), not from the final SBC/TAX. The map handoff's N=1 Z=0 was wrong; with D=$0000 at entry the exit is Z=1 N=0.",
  "B (A high byte) ends as $09 and X as $E0: the loop leaks these, translator must leave them so (caller then JSLs 0080b5, which only reads A low/Y after reloading).",
  "Stores are DP writes, so they always hit bank $00 $0801.. = the WRAM $7E mirror regardless of DB.",
  "Only Y bytes are written; X/tile/attr bytes ($0800+4n, +2, +3) and the OAM high table ($0A00-$0A1F) are left as they were.",
  "Write order (for bus-exact verification): pass X=$60: $0861..$087D,$08E1..$08FD,$0961..$097D,$09E1..$09FD (step 4); then X=$40, $20, $00 likewise. Only the final memory state matters functionally.",
  "No wrap: largest dp+X offset is $9D+$60 = $FD, so dp,X never crosses the 256-byte page.",
]
test_states = [
  "Buffer $0800-$0A1F filled with a nonzero, non-$F0 pattern (e.g. index bytes), D=$0000, A=$01xx, X=$xx, Y arbitrary: confirm only the 128 Y bytes become $F0 and nothing else in $0700-$0BFF changes.",
  "Same with D=$1234 (nonzero) at entry: confirm D restored, writes identical, exit N=0 Z=0; and D=$8000 for N=1.",
  "Check exit registers: A=$09E0, X=$E0, Y unchanged, C=0, V=0, S unchanged.",
]

